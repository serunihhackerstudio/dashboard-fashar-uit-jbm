<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0A2540"/>
<title>Dashboard FASHAR — UIT JBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
 /* Terapkan tema & status sidebar sebelum render agar tidak berkedip */
 (function(){
  try{
   var t=localStorage.getItem("fashar-theme");
   if(!t) t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
   document.documentElement.dataset.theme=t;
   if(localStorage.getItem("fashar-collapsed")==="1") document.documentElement.classList.add("nav-collapsed");
  }catch(e){document.documentElement.dataset.theme="light"}
 })();
</script>
</head>
<body>
<a class="skip" href="#content">Lewati ke konten</a>
<div class="app">

 <aside id="sidebar" class="sidebar" aria-label="Navigasi utama">
  <div class="brand">
   <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
   </div>
   <div class="brand-text">
    <div class="brand-title">FASHAR</div>
    <div class="brand-sub">UIT Jawa Bagian Timur &amp; Bali</div>
   </div>
  </div>
  <nav id="nav" class="nav"></nav>
  <button class="collapse-btn" id="collapseBtn" type="button" aria-label="Ciutkan sidebar" title="Ciutkan / lebarkan sidebar">
   <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Ciutkan</span>
  </button>
 </aside>
 <div class="backdrop" id="backdrop" hidden></div>

 <main class="main">
  <header class="topbar">
   <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
   </button>
   <div class="heading">
    <div class="eyebrow" id="pageEyebrow">Kinerja</div>
    <h1 id="pageTitle">Kinerja PDKB</h1>
   </div>
   <div class="top-actions">
    <span class="chip updated" title="Waktu pembaruan data terakhir">
     <i class="live-dot" aria-hidden="true"></i>Diperbarui 3 Okt 2026
    </span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
     <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
     <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
   </div>
  </header>

  <div class="content" id="content" tabindex="-1"></div>

  <footer class="foot">Prototype · Data masih statis (mock) berdasarkan dashboard Looker Studio existing.</footer>
 </main>
</div>
<script src="app.js"></script>
</body>
</html>
